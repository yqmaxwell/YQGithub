  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jar 版本差异比对</title>
    <link rel="stylesheet" href="/vendor/element-plus/index.css" />
    <!-- diff2html CSS -->
    <link rel="stylesheet" href="/vendor/diff2html/diff2html.min.css" />
    <style>
      /* ===== GitHub 浅色主题 ===== */
      :root {
        color-scheme: light;
        --bg-primary: #ffffff;
        --bg-secondary: #f6f8fa;
        --bg-tertiary: #f3f4f6;
        --bg-selected: #ddf4ff;
        --border-default: #d0d7de;
        --border-strong: #656d76;
        --border-accent: #0969da;
        --text-primary: #1f2328;
        --text-secondary: #656d76;
        --text-muted: #8b949e;
        --text-link: #0969da;
        --accent: #0969da;
        --good: #1a7f37;
        --warn: #9a6700;
        --bad: #cf222e;
        --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        --radius: 8px;
        --radius-sm: 6px;
        --space: 12px;
        --space-lg: 16px;
        --ease-fast: 120ms ease-out;
        --ease-normal: 200ms ease-out;

        --el-color-primary: var(--accent);
        --el-color-success: var(--good);
        --el-color-warning: var(--warn);
        --el-color-danger: var(--bad);
        --el-border-color: var(--border-default);
        --el-border-radius-base: 8px;
        --el-text-color-primary: var(--text-primary);
        --el-text-color-regular: var(--text-secondary);
        --el-fill-color-blank: var(--bg-secondary);
        --el-fill-color-light: var(--bg-tertiary);
        --el-bg-color: var(--bg-primary);
        --el-bg-color-overlay: var(--bg-secondary);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: var(--bg-primary);
        color: var(--text-primary);
        font-family: var(--sans);
        font-size: 14px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }

      #app { min-height: 100vh; display: flex; flex-direction: column; }

      /* ===== 顶部工具栏 ===== */
      .toolbar {
        display: flex;
        align-items: center;
        gap: var(--space);
        padding: var(--space) var(--space-lg);
        background: var(--bg-secondary);
        border-bottom: 1px solid var(--border-default);
        flex-shrink: 0;
        flex-wrap: wrap;
      }

      .toolbar__logo { font-weight: 700; font-size: 16px; margin-right: var(--space); white-space: nowrap; }

      /* Neubrutalism 模式Tab */
      .mode-tabs { display: flex; gap: 0; }
      .mode-tab {
        padding: 6px 16px;
        border: 2px solid var(--border-default);
        background: var(--bg-primary);
        color: var(--text-secondary);
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
        transition: all var(--ease-fast);
        margin-right: -2px;
      }
      .mode-tab:first-child { border-radius: var(--radius) 0 0 var(--radius); }
      .mode-tab:last-child { border-radius: 0 var(--radius) var(--radius) 0; margin-right: 0; }
      .mode-tab:hover { color: var(--text-primary); border-color: var(--border-strong); }
      .mode-tab--active {
        background: var(--bg-primary);
        color: var(--text-link);
        border-color: var(--border-accent);
        z-index: 1;
      }

      .toolbar__file { width: 180px; }
      .toolbar__ignore { width: 240px; }

      .nbt-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 18px;
        border: 2px solid var(--border-default);
        border-radius: var(--radius);
        background: var(--bg-primary);
        color: var(--text-primary);
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        transition: all var(--ease-fast);
        white-space: nowrap;
      }
      .nbt-btn:hover { border-color: var(--border-accent); background: var(--bg-tertiary); }
      .nbt-btn:active { transform: translate(1px, 1px); }
      .nbt-btn--primary {
        background: var(--bg-primary);
        color: var(--text-link);
        border-color: var(--border-default);
        box-shadow: 4px 4px 0 var(--border-default);
        transform: translate(-2px, -2px);
      }
      .nbt-btn--primary:hover { border-color: var(--border-accent); box-shadow: 2px 2px 0 var(--border-accent); transform: translate(-1px, -1px); }
      .nbt-btn--primary:active { box-shadow: none; transform: translate(0, 0); }
      .nbt-btn:disabled { opacity: 0.4; cursor: not-allowed; }

      /* ===== 工作区 ===== */
      .workspace {
        display: flex;
        flex: 1;
        min-height: 0;
        overflow: hidden;
        position: relative;
      }

      .left-panel {
        width: 400px;
        min-width: 280px;
        max-width: 760px;
        flex-shrink: 0;
        background: var(--bg-secondary);
        border-right: 1px solid var(--border-default);
        display: flex;
        flex-direction: column;
        min-height: 0;
        overflow: hidden;
      }

      .resizer {
        width: 4px;
        cursor: col-resize;
        background: transparent;
        flex-shrink: 0;
        transition: background 150ms ease-out;
        z-index: 2;
      }
      .resizer:hover { background: var(--border-accent); }

      .right-panel {
        flex: 1;
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: var(--bg-primary);
      }

      /* ===== Neubrutalism Tab 切换 ===== */
      .panel-tabs {
        display: flex;
        border-bottom: 1px solid var(--border-default);
        flex-shrink: 0;
      }
      .panel-tab {
        padding: 8px 18px;
        border: 2px solid transparent;
        border-bottom: 2px solid var(--border-default);
        background: transparent;
        color: var(--text-secondary);
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
        transition: all var(--ease-fast);
      }
      .panel-tab:hover { color: var(--text-primary); }
      .panel-tab--active {
        color: var(--text-primary);
        background: var(--bg-primary);
        border-color: var(--border-default);
        border-bottom-color: var(--bg-primary);
      }

      /* ===== 文件树 ===== */
      .file-tree { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 0; }
      .tree-search { padding: 0 var(--space-lg) 8px; }
      .tree-node {}
      .tree-dir { padding: 3px var(--space) 3px 12px; cursor: pointer; display: flex; align-items: center; gap: 5px; color: var(--text-secondary); font-size: 13px; font-weight: 600; transition: background var(--ease-fast); }
      .tree-dir:hover { background: var(--bg-tertiary); color: var(--text-primary); }
      .tree-dir__arrow { width: 14px; font-size: 10px; text-align: center; flex-shrink: 0; transition: transform var(--ease-fast); }
      .tree-dir__arrow--open { transform: rotate(90deg); }
      .tree-node-icon { width: 17px; height: 17px; object-fit: contain; flex-shrink: 0; }
      .tree-node-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .tree-text--modified .tree-node-label,
      .tree-text--modified .tree-dir__count,
      .tree-text--modified .tree-nested__count { color: var(--warn); }
      .tree-text--added .tree-node-label,
      .tree-text--added .tree-dir__count,
      .tree-text--added .tree-nested__count { color: var(--good); }
      .tree-text--missing .tree-node-label,
      .tree-text--missing .tree-dir__count,
      .tree-text--missing .tree-nested__count { color: var(--bad); }
      .tree-text--meta .tree-node-label,
      .tree-text--meta .tree-dir__count,
      .tree-text--meta .tree-nested__count { color: var(--accent); }
      .tree-file { padding: 3px var(--space) 3px 31px; cursor: pointer; display: flex; align-items: center; gap: 5px; font-size: 13px; transition: background var(--ease-fast); color: var(--text-primary); }
      .tree-file:hover { background: var(--bg-tertiary); }
      .tree-file--active { background: var(--bg-selected); border-left: 3px solid var(--border-accent); padding-left: 28px; }
      .tree-badge { width: 8px; height: 8px; margin-left: auto; border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 0 2px var(--bg-secondary); }
      .tree-badge--modified { background: var(--warn); }
      .tree-badge--added { background: var(--good); }
      .tree-badge--missing { background: var(--bad); }
      .tree-badge--meta { background: var(--accent); }
      .tree-nested { padding: 3px var(--space) 3px 12px; cursor: pointer; display: flex; align-items: center; gap: 5px; font-size: 13px; color: var(--text-secondary); transition: background var(--ease-fast); }
      .tree-nested:hover { background: var(--bg-tertiary); }
      .tree-nested__count { font-weight: 700; color: var(--warn); }

      /* Neubrutalism 状态标签 */
      .nbt-tag {
        display: inline-block;
        padding: 1px 6px;
        border: 2px solid currentColor;
        border-radius: 4px;
        font-weight: 700;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .nbt-tag--modified { color: var(--warn); }
      .nbt-tag--added    { color: var(--good); }
      .nbt-tag--missing  { color: var(--bad); }
      .nbt-tag--meta     { color: var(--accent); }

      /* ===== 统计栏 ===== */
      .stats-bar {
        display: flex;
        gap: var(--space-lg);
        padding: 8px var(--space-lg);
        border-top: 1px solid var(--border-default);
        font-size: 13px;
        color: var(--text-secondary);
        flex-shrink: 0;
      }
      .stats-bar strong { color: var(--text-primary); }

      /* ===== Diff 区域 ===== */
      .diff-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px var(--space-lg);
        border-bottom: 1px solid var(--border-default);
        background: var(--bg-secondary);
        flex-shrink: 0;
      }
      .diff-header__title { font-weight: 600; font-size: 14px; color: var(--text-primary); font-family: var(--mono); }
      .diff-header__actions { display: flex; gap: 8px; }
      .diff-empty { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 14px; }
      .diff-content { flex: 1; min-height: 0; overflow: auto; }
      .diff-nav { display: flex; gap: 8px; justify-content: flex-end; padding: 8px var(--space-lg); border-top: 1px solid var(--border-default); background: var(--bg-secondary); flex-shrink: 0; }

      /* ===== 结构比对 ===== */
      .structure-compare { display: flex; flex: 1; overflow: hidden; }
      .structure-pane { flex: 1; overflow-y: auto; padding: 8px 0; border-right: 1px solid var(--border-default); }
      .structure-pane:last-child { border-right: none; }
      .structure-fullwidth { position: fixed; inset: 0; z-index: 10; background: var(--bg-primary); display: flex; flex-direction: column; }
      .structure-fullwidth .structure-compare { flex: 1; }

      /* diff2html 浅色主题覆盖 */
      .d2h-wrapper { background: var(--bg-primary); color: var(--text-primary); }
      .d2h-file-header { background: var(--bg-secondary); border-color: var(--border-default); font-family: var(--sans); }
      .d2h-diff-table { background: var(--bg-primary); font-family: var(--mono); font-size: 13px; }
      .d2h-code-line { color: var(--text-primary); }
      .d2h-code-side-linenumber { background: var(--bg-secondary); color: var(--text-muted); border-color: var(--border-default); }
      .d2h-code-linenumber { background: var(--bg-secondary); color: var(--text-muted); border-color: var(--border-default); }
      .d2h-code-side-linenumber, .d2h-code-linenumber { position: sticky; left: 0; z-index: 1; }
      .d2h-del { background: #ffebe9; border-color: rgba(207, 34, 46, 0.2); }
      .d2h-ins { background: #dafbe1; border-color: rgba(26, 127, 55, 0.2); }
      .d2h-code-side-del { background: #ffebe9; }
      .d2h-code-side-ins { background: #dafbe1; }
      .d2h-info { background: var(--bg-secondary); color: var(--text-secondary); }
      .d2h-code-side-emptyplaceholder { background: var(--bg-secondary); border-color: var(--border-default); }
      .diff-content .d2h-diff-table,
      .diff-content .d2h-code-line,
      .diff-content .d2h-code-side-line,
      .diff-content .d2h-code-side-linenumber,
      .diff-content .d2h-code-linenumber { font-size: var(--diff-font-size, 13px); line-height: 1.5; }
      .diff-content pre { font-size: var(--diff-font-size, 13px) !important; line-height: 1.5; }

      /* ===== 设置抽屉 ===== */
      .settings-drawer { padding: var(--space-lg); }
      .settings-drawer label { display: flex; align-items: center; gap: var(--space); padding: 8px 0; font-size: 14px; color: var(--text-primary); cursor: pointer; }

      /* ===== 空状态 ===== */
      .empty-state {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: var(--space);
        color: var(--text-muted);
      }
      .empty-state__icon { font-size: 48px; opacity: 0.3; }

      /* ===== 滚动条 ===== */
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: var(--bg-primary); }
      ::-webkit-scrollbar-thumb { background: var(--border-default); border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

      /* ===== 动画 ===== */
      @keyframes selected-flash { 0% { background: rgba(9, 105, 218, 0.12); } 100% { background: var(--bg-selected); } }
      .tree-file--active { animation: selected-flash 300ms ease-out; }
      .tree-children-enter { animation: expandIn var(--ease-normal); }
      @keyframes expandIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

      /* [AGC:START] tool=Cc date=2026-07-27 author=maxwell */
      .app-root { min-height: 100vh; background: var(--bg-primary); }
      .setup-shell { display: flex; min-height: 100vh; min-height: 100dvh; flex-direction: column; background: var(--bg-primary); }
      .result-shell { display: flex; height: 100vh; height: 100dvh; min-height: 0; flex-direction: column; overflow: hidden; background: var(--bg-primary); }
      .result-shell--diff-focus .result-toolbar,
      .result-shell--diff-focus .left-panel,
      .result-shell--diff-focus .resizer { display: none; }
      .result-shell--diff-focus .right-panel { width: 100%; min-width: 0; }
      .result-shell--diff-focus .diff-header__title { max-width: none; }
      .setup-header, .result-toolbar { height: 56px; display: flex; align-items: center; gap: 16px; padding: 0 28px; border-bottom: 1px solid var(--border-default); background: var(--bg-primary); }
      .result-toolbar { flex-shrink: 0; }
      .brand-lockup { display: inline-flex; align-items: center; gap: 9px; color: var(--text-primary); font-weight: 700; letter-spacing: 0; white-space: nowrap; }
      .brand-mark { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 5px; background: var(--text-primary); color: #fff; font-family: var(--mono); font-size: 10px; letter-spacing: 0; }
      .setup-header { flex-shrink: 0; background: var(--bg-secondary); font-size: 13px; font-weight: 600; }
      .setup-header__path { overflow: hidden; max-width: min(55vw, 720px); color: var(--text-secondary); font-family: var(--mono); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
      .setup-header__actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
      .setup-header__status { color: var(--text-muted); font-family: var(--mono); font-size: 11px; font-weight: 500; }
      .setup-configbar { display: flex; min-height: 48px; align-items: center; gap: 18px; padding: 0 28px; border-bottom: 1px solid var(--border-default); background: var(--bg-primary); }
      .setup-configbar__group { display: flex; min-width: 0; align-items: center; gap: 12px; }
      .setup-configbar__label { color: var(--text-muted); font-family: var(--mono); font-size: 10px; font-weight: 700; text-transform: uppercase; white-space: nowrap; }
      .setup-configbar__separator { width: 1px; height: 20px; background: var(--border-default); }
      .setup-main { width: min(1060px, calc(100% - 64px)); margin: 0 auto; padding: clamp(42px, 7vh, 68px) 0 48px; }
      .setup-intro { margin-bottom: 28px; }
      .setup-intro h1 { margin: 0 0 7px; font-size: 26px; line-height: 1.25; letter-spacing: 0; }
      .setup-intro p { margin: 0; color: var(--text-secondary); font-size: 13px; }
      .setup-workspace { width: 100%; }
      .setup-section-label { display: block; margin: 0 0 9px; color: var(--text-muted); font-family: var(--mono); font-size: 10px; font-weight: 700; text-transform: uppercase; }
      .mode-tabs { display: inline-flex; align-items: center; overflow: hidden; border: 1px solid var(--border-default); border-radius: 6px; background: var(--bg-primary); box-shadow: 0 1px 2px rgba(31, 35, 40, .04); }
      .mode-tab { display: inline-flex; min-width: 68px; height: 32px; align-items: center; justify-content: center; margin: 0; padding: 0 14px; border: 0; border-right: 1px solid var(--border-default); background: var(--bg-primary); color: var(--text-secondary); font-size: 12px; font-weight: 600; cursor: pointer; transition: background var(--ease-fast), color var(--ease-fast); }
      .mode-tab:last-child { border-right: 0; }
      .mode-tab:hover { background: var(--bg-secondary); color: var(--text-primary); }
      .mode-tab--active { background: var(--bg-selected); color: var(--accent); font-weight: 700; }
      .setup-checks { display: flex; align-items: center; gap: 8px; }
      .scope-chip { display: inline-flex; height: 30px; align-items: center; gap: 6px; padding: 0 10px; border: 1px solid var(--border-default); border-radius: 999px; background: var(--bg-primary); color: var(--text-secondary); font-size: 12px; font-weight: 600; cursor: pointer; transition: background var(--ease-fast), border-color var(--ease-fast), color var(--ease-fast); }
      .scope-chip span { width: 6px; height: 6px; border-radius: 50%; background: var(--border-strong); }
      .scope-chip:hover { border-color: var(--border-strong); color: var(--text-primary); }
      .scope-chip--active { border-color: rgba(9, 105, 218, .28); background: var(--bg-selected); color: var(--accent); }
      .scope-chip--active span { background: var(--accent); }
      .source-grid { display: grid; grid-template-columns: minmax(0, 1fr) 88px minmax(0, 1fr); align-items: stretch; }
      .source-field { min-width: 0; min-height: 168px; display: flex; flex-direction: column; border: 1px solid var(--border-default); border-radius: 6px; background: var(--bg-primary); box-shadow: 0 1px 2px rgba(31, 35, 40, .04); transition: border-color var(--ease-fast), box-shadow var(--ease-fast); }
      .source-field:hover { border-color: #afb8c1; box-shadow: 0 3px 10px rgba(31, 35, 40, .05); }
      .source-field--ready { border-color: rgba(26, 127, 55, .45); box-shadow: inset 0 2px 0 var(--good); }
      .source-field__head { display: flex; align-items: center; gap: 9px; padding: 10px 13px; border-bottom: 1px solid var(--border-default); background: var(--bg-primary); }
      .source-field__step { display: inline-flex; height: 20px; min-width: 28px; align-items: center; justify-content: center; border: 1px solid var(--border-default); border-radius: 999px; color: var(--text-muted); font-family: var(--mono); font-size: 10px; }
      .source-field__label { color: var(--text-primary); font-size: 12px; font-weight: 700; }
      .source-field__control { display: flex; min-width: 0; flex: 1; flex-direction: column; justify-content: center; gap: 10px; padding: 20px; }
      /* [AGC:START] tool=Cc author=maxwell date=2026-07-29 */
      .source-grid--text .source-field { min-height: 320px; }
      .source-grid--text .source-field__control { justify-content: stretch; padding: 12px; }
      .text-source-input { width: 100%; min-height: 238px; flex: 1; resize: none; overflow: auto; padding: 12px; border: 1px solid var(--border-default); border-radius: 5px; outline: none; background: var(--bg-primary); color: var(--text-primary); font-family: var(--mono); font-size: 13px; line-height: 1.55; }
      .text-source-input::placeholder { color: var(--text-muted); }
      .text-source-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(9, 105, 218, .12); }
      /* [AGC:END] */
      .source-field__value { overflow: hidden; min-height: 28px; padding: 6px 9px; border: 1px solid var(--border-default); border-radius: 5px; background: var(--bg-secondary); color: var(--text-secondary); font-family: var(--mono); font-size: 11px; text-align: left; text-overflow: ellipsis; white-space: nowrap; }
      .source-upload, .source-upload .el-upload { display: block; width: 100%; }
      .upload-button { width: 100%; height: 38px; border: 1px solid var(--border-default); border-radius: 5px; background: var(--bg-primary); color: var(--text-primary); font-weight: 600; }
      .upload-button:hover { border-color: var(--accent); color: var(--accent); background: var(--bg-selected); }
      .source-divider { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 6px; padding: 0 10px; color: var(--text-muted); }
      .source-divider span { height: 1px; background: var(--border-default); }
      .source-divider b { padding: 4px 6px; border: 1px solid var(--border-default); border-radius: 999px; background: var(--bg-primary); font-family: var(--mono); font-size: 10px; font-weight: 700; text-align: center; white-space: nowrap; }
      .setup-options { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-top: 18px; padding: 14px 0 0; border-top: 1px solid var(--border-default); }
      /* [AGC:START] tool=Cc author=maxwell date=2026-07-29 */
      .setup-options--text { justify-content: flex-end; }
      .text-compare-hint { color: var(--text-muted); font-size: 12px; }
      /* [AGC:END] */
      .setup-ignore-wrap { min-width: 0; flex: 1; }
