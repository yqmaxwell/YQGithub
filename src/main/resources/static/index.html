<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jar 版本差异比对</title>
    <link rel="stylesheet" href="/vendor/element-plus/index.css" />
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f6f8;
        --panel: rgba(255, 255, 255, 0.72);
        --panel-2: rgba(255, 255, 255, 0.86);
        --border: rgba(17, 24, 39, 0.12);
        --border-2: rgba(17, 24, 39, 0.18);
        --text: #0b1020;
        --muted: rgba(11, 16, 32, 0.62);
        --muted-2: rgba(11, 16, 32, 0.46);
        --shadow: 0 10px 30px rgba(11, 16, 32, 0.08), 0 2px 8px rgba(11, 16, 32, 0.06);
        --shadow-tight: 0 6px 18px rgba(11, 16, 32, 0.10);
        --radius: 12px;
        --radius-sm: 10px;
        --radius-lg: 16px;
        --space: 12px;
        --space-lg: 16px;
        --accent: #4a90e2;
        --accent-2: #86b7f2;
        --good: #0f9b6c;
        --warn: #d97706;
        --bad: #dc2626;
        --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        --serif: ui-serif, "Iowan Old Style", "Palatino", "Palatino Linotype", "Georgia", serif;
        --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI",
          "Helvetica Neue", Arial, "Noto Sans", "Liberation Sans", sans-serif;

        --el-color-primary: var(--accent);
        --el-color-primary-light-3: #6aa6ea;
        --el-color-primary-light-5: #86b7f2;
        --el-color-primary-light-7: #a8cdf8;
        --el-color-primary-light-8: #c4defc;
        --el-color-primary-light-9: #dbeafe;
        --el-color-primary-dark-2: #357abd;
        --el-color-success: var(--good);
        --el-color-warning: var(--warn);
        --el-color-danger: var(--bad);
        --el-border-color: rgba(11, 16, 32, 0.20);
        --el-border-color-light: rgba(11, 16, 32, 0.14);
        --el-border-radius-base: 10px;
        --el-text-color-primary: var(--text);
        --el-text-color-regular: rgba(11, 16, 32, 0.76);
        --el-text-color-secondary: rgba(11, 16, 32, 0.56);
        --el-fill-color-blank: rgba(255, 255, 255, 0.70);
        --el-fill-color-light: rgba(255, 255, 255, 0.82);
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--sans);
        background-image: none;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        background: none;
      }

      body::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        opacity: 0;
        background-image: none;
      }

      .app-shell {
        min-height: 100vh;
      }

      .app-shell,
      .layout,
      .sidebar,
      .content {
        position: relative;
        z-index: 1;
      }

      .app-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .app-header-collapsed {
        padding: 8px 0;
      }

      .app-topbar {
        background: rgba(246, 243, 238, 0.72) !important;
        border-bottom: 1px solid rgba(11, 16, 32, 0.10) !important;
        backdrop-filter: blur(14px) saturate(1.2);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .brand-mark {
        width: 28px;
        height: 28px;
        border-radius: 10px;
        background:
          radial-gradient(12px 12px at 30% 28%, rgba(255, 255, 255, 0.92), rgba(255, 255, 255, 0) 60%),
          linear-gradient(135deg, rgba(51, 65, 85, 0.96), rgba(100, 116, 139, 0.92));
        box-shadow: 0 12px 22px rgba(11, 16, 32, 0.12), 0 6px 16px rgba(11, 16, 32, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.60);
      }

      .brand-title {
        display: flex;
        flex-direction: column;
        line-height: 1.1;
      }

      .brand-title strong {
        font-size: 14px;
        letter-spacing: 0.2px;
        font-family: var(--serif);
      }

      .brand-title span {
        font-size: 12px;
        color: var(--muted);
      }

      .layout {
        height: calc(100vh - var(--app-header-h, 64px));
      }

      .sidebar {
        padding: var(--space-lg);
        height: 100%;
        overflow: hidden;
      }

      .sidebar.is-collapsed {
        padding: 10px 8px;
      }

      .sidebar-rail {
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        background: var(--panel);
        box-shadow: var(--shadow);
        height: 100%;
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .sidebar.is-collapsed .sidebar-rail {
        padding: 8px;
      }

      .sidebar-rail .rail-section {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .sidebar-resizer {
        flex: 0 0 8px;
        height: 100%;
        margin: var(--space-lg) 0;
        border-radius: 10px;
        cursor: col-resize;
        position: relative;
      }

      .sidebar-resizer::before {
        content: "";
        position: absolute;
        left: 50%;
        top: 8px;
        bottom: 8px;
        width: 1px;
        transform: translateX(-50%);
        background: rgba(11, 16, 32, 0.12);
      }

      .sidebar-resizer:hover {
        background: rgba(11, 16, 32, 0.06);
      }

      .content {
        padding: var(--space-lg);
        height: 100%;
        overflow: hidden;
      }

      .compact .sidebar,
      .compact .content {
        padding: 10px;
      }

      .compact .panel-head {
        padding: 8px;
      }

      .compact .viewer-bar {
        padding: 8px;
        gap: 8px;
      }

      .header-actions {
        display: flex;
        align-items: flex-end;
        flex-direction: column;
        gap: 10px;
        justify-content: flex-end;
      }

      .header-row {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .header-row-actions {
        justify-content: flex-end;
      }

      .file-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 8px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--panel-2);
        font-size: 12px;
        color: rgba(11, 16, 32, 0.82);
        max-width: 260px;
      }

      .file-pill span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .mono {
        font-family: var(--mono);
      }

      .panel {
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        overflow: hidden;
        background: var(--panel);
        box-shadow: var(--shadow);
        height: 100%;
        display: flex;
        flex-direction: column;
      }

      .panel-head {
        padding: 10px;
        border-bottom: 1px solid rgba(11, 16, 32, 0.10);
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .panel-body {
        flex: 1;
        overflow: auto;
      }

      .file-list {
        padding: 6px;
      }

      .file-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 8px 10px;
        border-radius: 10px;
        cursor: pointer;
        position: relative;
        border: 1px solid transparent;
      }

      .file-item:hover {
        background: rgba(255, 255, 255, 0.54);
        border-color: rgba(11, 16, 32, 0.10);
      }

      .file-item.active {
        background: rgba(27, 108, 168, 0.10);
        border-color: rgba(27, 108, 168, 0.22);
      }

      .file-item.active::before {
        content: "";
        position: absolute;
        left: 6px;
        top: 7px;
        bottom: 7px;
        width: 3px;
        border-radius: 999px;
        background: linear-gradient(180deg, rgba(27, 108, 168, 0.95), rgba(124, 58, 237, 0.92));
      }

      .file-path {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 12px;
        color: rgba(11, 16, 32, 0.82);
      }

      .viewer {
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        overflow: hidden;
        background: var(--panel);
        box-shadow: var(--shadow);
        height: 100%;
        display: flex;
        flex-direction: column;
      }

      .viewer-bar {
        padding: 10px;
        border-bottom: 1px solid rgba(11, 16, 32, 0.10);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
      }

      .path-input {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: 1 1 520px;
        min-width: 0;
        flex-wrap: wrap;
      }

      .path-input .el-input {
        flex: 1 1 320px;
        min-width: 240px;
      }

      .md5-tag {
        max-width: 520px;
      }

      .md5-tag .el-tag__content {
        white-space: normal;
      }

      .md5-tag .md5 {
        word-break: break-all;
        white-space: normal;
      }

      .viewer-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .structure-compare {
        flex: 1;
        overflow: auto;
      }

      .structure-compare-head {
        position: sticky;
        top: 0;
        z-index: 2;
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--border);
        padding: 8px 10px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .structure-compare-cols {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 40px minmax(0, 1fr);
        gap: 12px;
        font-size: 12px;
        color: var(--muted);
        padding: 6px 10px;
        border-bottom: 1px solid rgba(11, 16, 32, 0.08);
        background: rgba(255, 255, 255, 0.62);
        position: sticky;
        top: 44px;
        z-index: 2;
        backdrop-filter: blur(8px);
      }

      .deps-structure .structure-compare-cols {
        top: 0;
      }

      .structure-compare-cols > div:first-child {
        padding-right: 10px;
        background: #fbfcff;
      }

      .structure-compare-cols > div:last-child {
        padding-left: 10px;
        background: #ffffff;
      }

      .structure-compare-cols .mid {
        background: transparent;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }

      .structure-compare-cols .mid::before {
        content: '';
        width: 1px;
        height: 100%;
        background: var(--border);
      }

      .structure-tree-wrap {
        padding: 10px;
        position: relative;
      }

      .structure-tree-wrap::before {
        content: '';
        position: absolute;
        top: 0;
        bottom: 0;
        left: 50%;
        width: 1px;
        background: rgba(11, 16, 32, 0.10);
        pointer-events: none;
        z-index: 10;
      }

      .structure-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 40px minmax(0, 1fr);
        gap: 12px;
        align-items: center;
        min-width: 0;
      }

      .structure-cell {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        border-radius: 10px;
        padding: 4px 10px;
      }

      .structure-cell.left {
        background: rgba(255, 255, 255, 0.66);
        border: 1px solid rgba(11, 16, 32, 0.10);
      }

      .structure-cell.right {
        background: rgba(255, 255, 255, 0.74);
        border: 1px solid rgba(11, 16, 32, 0.10);
      }

      .structure-cell.s-modified {
        border-color: #eef1f7;
      }

      .structure-cell.s-added {
        border-color: #eef1f7;
      }

      .structure-cell.s-missing {
        border-color: #eef1f7;
      }

      .structure-cell.s-meta {
        border-color: #eef1f7;
      }

      .structure-gutter {
        height: 100%;
        display: flex;
        align-items: stretch;
        justify-content: center;
        position: relative;
      }

      .structure-gutter::before {
        content: '';
        width: 1px;
        background: transparent;
      }

      .structure-label {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .structure-icon {
        color: #9ca3af;
      }

      .structure-expander,
      .structure-bullet {
        width: 14px;
        display: inline-flex;
        justify-content: center;
        color: rgba(11, 16, 32, 0.56);
        flex: 0 0 14px;
      }

      .structure-bullet {
        color: rgba(11, 16, 32, 0.34);
      }

      .structure-cell.s-modified .structure-icon,
      .structure-cell.s-modified .structure-label {
        color: rgba(217, 119, 6, 0.96);
      }

      .structure-cell.s-added .structure-icon,
      .structure-cell.s-added .structure-label {
        color: rgba(15, 155, 108, 0.96);
      }

      .structure-cell.s-missing .structure-icon,
      .structure-cell.s-missing .structure-label {
        color: rgba(220, 38, 38, 0.96);
      }

      .structure-cell.s-meta .structure-icon,
      .structure-cell.s-meta .structure-label {
        color: rgba(27, 108, 168, 0.96);
      }

      .structure-placeholder {
        visibility: visible;
      }

      .structure-placeholder > * {
        visibility: hidden;
      }

      .diff-view {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .diff-top {
        border-bottom: 1px solid rgba(11, 16, 32, 0.10);
        background: rgba(255, 255, 255, 0.64);
        backdrop-filter: blur(8px);
      }

      .diff-head {
        padding: 8px 10px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0;
        align-items: center;
        font-size: 12px;
        color: var(--muted);
      }

      .diff-head .h {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        min-width: 0;
      }

      .diff-head .h:first-child {
        border-right: 1px solid #f2f3f5;
        padding-right: 10px;
      }

      .diff-head .h:last-child {
        padding-left: 10px;
      }

      .diff-legend {
        padding: 6px 10px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
        border-top: 1px solid #f2f3f5;
      }

      .diff-sbs {
        flex: 1;
        display: grid;
        grid-template-columns: 1fr 1fr;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.36);
      }

      .diff-sbs.with-minimap {
        grid-template-columns: 1fr 1fr 14px;
      }

      .diff-minimap {
        position: relative;
        border-left: 1px solid rgba(11, 16, 32, 0.10);
        background: rgba(255, 255, 255, 0.46);
        overflow: hidden;
      }

      .diff-minimap-mark {
        position: absolute;
        left: 3px;
        right: 3px;
        border-radius: 8px;
        background: rgba(27, 108, 168, 0.38);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.55);
        cursor: pointer;
      }

      .diff-minimap-mark.mk-added {
        background: rgba(15, 155, 108, 0.42);
      }

      .diff-minimap-mark.mk-missing {
        background: rgba(220, 38, 38, 0.42);
      }

      .diff-minimap-mark.mk-modified {
        background: rgba(217, 119, 6, 0.45);
      }

      .diff-minimap-mark.mk-mixed {
        background: linear-gradient(180deg, rgba(220, 38, 38, 0.44), rgba(15, 155, 108, 0.44));
      }

      .diff-minimap-mark:hover {
        filter: brightness(1.12);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.70);
      }

      .diff-pane {
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border-right: 1px solid rgba(11, 16, 32, 0.10);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.30);
      }

      .diff-pane:last-child {
        border-right: none;
      }

      .diff-pane-head {
        position: sticky;
        top: 0;
        z-index: 2;
        padding: 8px 10px;
        border-bottom: 1px solid rgba(11, 16, 32, 0.08);
        font-size: 12px;
        color: var(--muted);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        background: rgba(255, 255, 255, 0.64);
        backdrop-filter: blur(8px);
      }

      .diff-pane-body {
        flex: 1;
        overflow: auto;
        font-family: var(--mono);
        font-size: 12px;
        line-height: 1.55;
        scrollbar-gutter: stable;
      }

      .diff-pane-body.left {
        background: rgba(255, 255, 255, 0.56);
      }

      .diff-pane-body.right {
        background: rgba(255, 255, 255, 0.62);
      }

      .diff-line {
        display: flex;
        align-items: flex-start;
        border-bottom: 1px solid rgba(11, 16, 32, 0.06);
        min-height: 1.55em;
        min-width: 100%;
        width: max-content;
      }

      .diff-line:hover {
        background: rgba(255, 255, 255, 0.40);
      }

      .diff-ln {
        width: 54px;
        flex: 0 0 54px;
        text-align: right;
        color: var(--muted-2);
        padding: 0 10px 0 6px;
        user-select: none;
        background: linear-gradient(90deg, rgba(11, 16, 32, 0.04), rgba(11, 16, 32, 0.00));
      }

      .diff-code {
        flex: 1 0 auto;
        white-space: pre;
        overflow: visible;
        text-overflow: clip;
      }

      .diff-code.wrap {
        flex: 1 1 auto;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .wrap-lines .diff-line {
        width: 100%;
      }

      .wrap-lines .diff-code {
        flex: 1 1 auto;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .diff-gap {
        padding: 6px 10px;
        color: var(--muted-2);
        background: #fafbff;
        font-size: 11px;
        border-bottom: 1px dashed #d7dbe6;
      }

      .diff-hunk-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
      }

      .diff-hunk-title {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
        color: rgba(11, 16, 32, 0.78);
      }

      .diff-hunk-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .diff-hunk-collapsed {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
      }

      .line {
        position: relative;
        display: block;
        padding: 0 8px 0 14px;
        border-radius: 8px;
      }

      .line::before {
        content: "";
        position: absolute;
        left: 6px;
        top: 3px;
        bottom: 3px;
        width: 3px;
        border-radius: 999px;
        background: transparent;
      }

      .line.add {
        background: rgba(15, 155, 108, 0.10);
      }

      .line.add::before {
        background: rgba(15, 155, 108, 0.92);
      }

      .line.del {
        background: rgba(220, 38, 38, 0.10);
      }

      .line.del::before {
        background: rgba(220, 38, 38, 0.94);
      }

      .line.mod {
        background: rgba(217, 119, 6, 0.12);
      }

      .line.mod::before {
        background: rgba(217, 119, 6, 0.95);
      }

      .line.active {
        outline: 2px solid rgba(27, 108, 168, 0.55);
      }

      .panel-body::-webkit-scrollbar,
      .structure-compare::-webkit-scrollbar,
      .diff-pane-body::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }

      .panel-body::-webkit-scrollbar-thumb,
      .structure-compare::-webkit-scrollbar-thumb,
      .diff-pane-body::-webkit-scrollbar-thumb {
        background: rgba(11, 16, 32, 0.18);
        border-radius: 999px;
        border: 2px solid rgba(255, 255, 255, 0.55);
      }

      .panel-body::-webkit-scrollbar-thumb:hover,
      .structure-compare::-webkit-scrollbar-thumb:hover,
      .diff-pane-body::-webkit-scrollbar-thumb:hover {
        background: rgba(11, 16, 32, 0.26);
      }

      .panel-body::-webkit-scrollbar-corner,
      .structure-compare::-webkit-scrollbar-corner,
      .diff-pane-body::-webkit-scrollbar-corner {
        background: transparent;
      }

      .el-button {
        border-radius: 10px;
        font-weight: 600;
        letter-spacing: 0.2px;
      }

      .el-button--primary:not(.is-plain) {
        border: 1px solid rgba(11, 16, 32, 0.14);
        background: var(--accent) !important;
        box-shadow: 0 2px 6px rgba(11, 16, 32, 0.12);
      }

      .el-button--primary:not(.is-plain):hover {
        background: var(--el-color-primary-dark-2) !important;
      }

      .el-button--primary:not(.is-plain).is-disabled,
      .el-button--primary:not(.is-plain).is-disabled:hover {
        box-shadow: none;
        border-color: rgba(11, 16, 32, 0.10);
      }

      .el-input__wrapper,
      .el-textarea__inner,
      .el-select__wrapper,
      .el-autocomplete .el-input__wrapper {
        background: rgba(255, 255, 255, 0.66);
        box-shadow: none !important;
        border-radius: 12px;
      }

      .el-input__wrapper.is-focus,
      .el-select__wrapper.is-focus {
        outline: 2px solid rgba(51, 65, 85, 0.22);
      }

      .dir-path-inputs .el-input__wrapper {
        background: rgba(255, 255, 255, 0.86);
        box-shadow: 0 0 0 1px rgba(11, 16, 32, 0.22) inset !important;
