server.port=8085
# 仅监听本机回环地址：桌面工具不对外暴露 web 服务，仅供窗口内 WebView 访问
server.address=127.0.0.1
spring.servlet.multipart.max-file-size=1024MB
spring.servlet.multipart.max-request-size=1024MB
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

server.tomcat.threads.max=50
server.tomcat.threads.min-spare=10
server.tomcat.accept-count=100
server.tomcat.max-connections=2000

jardiff.concurrency.max-compares=2

# [AGC:START] tool=Cc date=2026-07-29 author=maxwell
jardiff.deployment-mode=local
# [AGC:END]

jardiff.limits.default-warmup-diffs=80
jardiff.limits.max-warmup-diffs=400
jardiff.limits.max-compare-sessions=4
jardiff.limits.max-compare-bytes=2147483648

# 单次比对的上传体积 / 文件数限制
jardiff.limits.max-jar-mb=512
jardiff.limits.max-dir-files-per-side=40000
jardiff.limits.max-dir-mb-per-side=2000

# 比对会话在内存中的存活时长（分钟）与过期清理间隔（毫秒）
jardiff.limits.session-ttl-minutes=30
jardiff.limits.session-cleanup-interval-ms=60000

# 默认忽略规则：前端忽略规则输入框首次打开时即展示此值（可改，改后存 localStorage）；
# 请求未传 ignoreGlobs 时后端也以此兜底。忽略项不写入临时 zip，也不计入体积/文件数上限。
# 语法：单星号 * 可跨目录分隔符，多条用英文逗号分隔。目录类规则需带 * 前缀，
# 否则只匹配顶层（例：写 .idea/* 匹配不到 plca_dynamic_sy/.idea/xxx，需写 *.idea/*）。
# 覆盖范围：Spring Boot 包签名与索引文件、IDE 元数据、构建产物、版本库目录、
#           AI 工具配置（.claude/.codex 等）、工具缓存（.codegraph/node_modules/__pycache__）、
#           运行日志、文档目录、顶层 test/tools 脚本目录与 AI 说明文件。仅保留项目源码与构建配置参与比对。
jardiff.ignore.default-globs=META-INF/*.SF,META-INF/*.RSA,META-INF/*.DSA,META-INF/MANIFEST.MF,BOOT-INF/classpath.idx,BOOT-INF/layers.idx,*.DS_Store,*.iml,*.project,*.classpath,*.log*,*target/*,*.svn/*,*.idea/*,*.codegraph/*,*node_modules/*,*.claude/*,*.codex/*,*.codebuddy/*,*.zcode/*,*.workbuddy/*,*.settings/*,*.playwright*/*,*__pycache__/*,logs/*,docs/*,output/*,*CLAUDE.md,*AGENTS.md,*.mcp.json,test/*,tools/*

# 内嵌 jar 深度索引：单个内嵌 jar 上限 MB、单次比对内嵌 jar 总量上限 MB、内嵌 jar 数量上限
jardiff.deep-index.inner-jar-max-mb=8
jardiff.deep-index.inner-jar-total-max-mb=160
jardiff.deep-index.inner-jar-max-count=40

# 超过该大小的 jar 只比对元信息，不展开内嵌内容（MB）
jardiff.deep-compare.meta-only-jar-max-mb=64

# 差异计算体积上限（字节）。超过上限则跳过逐行/反编译差异，仅展示摘要。
jardiff.diff.max-text-bytes=2097152
jardiff.diff.max-class-bytes=2097152
jardiff.diff.max-nested-class-index-bytes=16777216
jardiff.diff.max-nested-extract-bytes=314572800
